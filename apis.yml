name: High Jump Software
description: 'HighJump Software was a Minneapolis-based provider of supply chain execution
  software, best known for its warehouse management system (WMS) and its extensible,
  configurable architecture for distribution, direct-store-delivery, and manufacturing
  operations. The company was acquired by Battery Ventures in 2014, expanded through
  acquisitions (Accellos, Nexus, TrueCommerce lines), then acquired by Körber in 2017
  and folded into Körber Supply Chain Software. As of 2024 the portfolio was rebranded
  Infios. The standalone HighJump brand is retired: highjump.com now 301-redirects to
  infios.com, and the company publishes no public developer portal, API documentation,
  or machine-readable API specification. This profile is retained as a historical /
  acquired-company record in the API Evangelist network.'
